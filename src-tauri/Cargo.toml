[package]
name = "jpeg-xl-konverter"
version = "0.1.0"
description = "JPEG XL Konverter"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jpeg_xl_konverter_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
imagesize = "0.15.0"
jxl-oxide = { version = "0.12.6", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
webp = { version = "0.3.1", default-features = false }
tiff = { version = "0.11.3", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
jpeg-encoder = "0.7.1"
miniz_oxide = "0.9.1"
moxcms = "0.8.1"
png = "0.18.1"
tempfile = "3.27.0"
